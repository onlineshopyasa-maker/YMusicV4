name: build-apk

# Dijalankan manual: tab Actions -> build-apk -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: d79bfb002882b75dd8d2255873d3e5e2dc938f4a
  NDK_VERSION: 28.2.13676358

jobs:
  ffmpeg:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        slug:
          - android-armeabi-v7a
          - android-arm64-v8a
          - android-x86
          - android-x86_64
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build ffmpeg
        working-directory: ffmpeg-build
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm automake autoconf libtool pkg-config meson ninja-build cmake
          scripts/build-android.sh "${SLUG#android-}" || {
            for log in .deps-$SLUG/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }

  android:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: YMusicV4

      - name: Restore ffmpeg android-armeabi-v7a
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-armeabi-v7a
          key: ffmpeg-android-armeabi-v7a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-arm64-v8a
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-arm64-v8a
          key: ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-x86
          key: ffmpeg-android-x86-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86_64
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-build/out/android-x86_64
          key: ffmpeg-android-x86_64-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Tanpa SECRETS_PASSPHRASE: build unsigned, tanpa Sentry, tanpa remote config.
      - name: Assemble release APKs
        working-directory: YMusicV4
        run: ./gradlew -Pproduction=true :androidApp:assembleRelease

      - name: Sign APK with test key
        working-directory: YMusicV4
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Test"
          AS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for f in androidApp/build/outputs/apk/release/*.apk; do
            "$AS" sign --ks "$RUNNER_TEMP/test.jks" --ks-pass pass:android \
              --out "${f%.apk}-signed.apk" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: YMusicV4/androidApp/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
